[workspace]
members = ["cli"]
exclude = ["vendor"]

[package]
name = "office-parser"
version = "0.2.0"
edition = "2024"
description = "Parse Office and data/config files into a structured document AST for ingestion and export."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/office-parser"
keywords = ["parser", "office", "docx", "pdf", "ingestion"]
categories = ["parser-implementations", "text-processing", "command-line-utilities"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[features]
default = [
    "docx",
    "pptx",
    "odt",
    "odp",
    "pdf",
    "rtf",
    "epub",
    "json",
    "yaml",
    "toml",
    "xml",
    "xlsx",
    "ods_sheet",
    "csv",
    "tsv",
    "xmind",
    "mmap",
]
# Config / data formats
json = []
yaml = ["dep:serde_yaml"]
toml = ["dep:toml"]
xml = ["dep:quick-xml"]
epub = ["dep:zip", "dep:quick-xml"]

# Spreadsheets
xlsx = ["dep:calamine", "dep:zip", "dep:quick-xml"]
ods_sheet = ["dep:calamine", "dep:zip", "dep:quick-xml"]
csv = ["dep:csv"]
tsv = ["dep:csv"]

# Office Open XML formats
pptx = ["dep:zip", "dep:quick-xml"]
docx = ["dep:zip", "dep:quick-xml"]

# ODF formats
odp = ["dep:zip", "dep:quick-xml"]
odt = ["dep:zip", "dep:quick-xml"]

# Mindmap formats
xmind = ["dep:zip", "dep:quick-xml"]
mmap = ["dep:zip", "dep:quick-xml"]

# PDF
pdf = ["dep:lopdf"]
render-pdfium = ["dep:pdfium-render", "dep:image"]
render-hayro = ["pdf", "dep:hayro", "dep:image"]
# In-process Indra engine over ONNX Runtime — the only OCR path (Rust + pdfium).
ocr-indra-native = ["dep:ort", "dep:image"]
# rten as alternative runtime for the same models (A/B via INDRA_RUNTIME=rten)
ocr-rten = ["pdf", "dep:rten", "dep:rten-tensor", "rten/rten_format"]
# Table-structure recognition for OCR'd pages (TASK 13, own port): table
# regions crop + preprocess to 488x488 and run the SLANet-plus ONNX through
# the rten runtime already shipped by `ocr-rten` (rten's default features
# include onnx_format); decode (TableLabelDecode) + cell matching (TableMatch)
# + HTML rendering are ported in-tree (src/formats/table_structure.rs) — no
# vendored crates, no ndarray. Off by default; feature off = no new dep
# beyond what `pdf` already pulls.
ocr-table-structure = ["pdf", "dep:image", "ocr-rten"]

# RTF
rtf = []

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
crc32fast = "1"
png = "0.17"
calamine = { version = "0.26", optional = true }
csv = { version = "1", optional = true }

zip = { version = "0.6", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.39", optional = true }

lopdf = { version = "0.35", optional = true }
pdfium-render = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ort = { version = "=2.0.0-rc.13", optional = true }  # pinned: rc.14 changes the Session API
rten = { version = "0.27.0", optional = true }
rten-tensor = { version = "0.27.0", optional = true }
hayro = { path = "vendor/hayro", optional = true }

# releases the fixes.

# Vendored, patched hayro stack (origin: upstream laurenzv/hayro 0.9.0, MIT OR Apache-2.0).
# Each patch carries "PdfCraft patch:" markers; remove once upstream releases the fixes.
[patch.crates-io]
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-font = { path = "vendor/hayro-font" }
