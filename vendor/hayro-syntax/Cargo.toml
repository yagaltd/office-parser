[package]
name = "hayro-syntax"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "A low-level crate for reading PDF files."
repository = "https://github.com/LaurenzV/hayro"

[features]
default = ["std", "images"]
std = ["hayro-ccitt?/std", "hayro-jbig2?/std", "hayro-jpeg2000?/std", "dep:rustc-hash", "zune-jpeg?/std"]
images = ["dep:zune-jpeg", "dep:hayro-ccitt", "dep:hayro-jbig2", "dep:hayro-jpeg2000"]
unsafe = [
    "std",
    "dep:zlib-rs",
    "dep:memchr",
    "hayro-jbig2?/simd",
    "hayro-jpeg2000?/simd",
    "zune-jpeg?/x86",
    "zune-jpeg?/neon",
]

[dependencies]
rustc-hash = { version = "2", optional = true }
smallvec = "1"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zlib-rs = { version = "0.6.8", optional = true, default-features = false, features = ["rust-allocator"] }
memchr = { version = "2.8.0", optional = true, default-features = false, features = ["alloc"] }
zune-jpeg = { version = "0.5", optional = true, default-features = false }
hayro-ccitt = { version = "0.5.0", optional = true, default-features = false }
hayro-jbig2 = { version = "0.4.0", optional = true, default-features = false }
hayro-jpeg2000 = { version = "0.5.0", optional = true, default-features = false }

[dev-dependencies]
sha2 = "0.10"
md5 = "0.8"
aes = "0.8.4"
cbc = "0.1.2"
