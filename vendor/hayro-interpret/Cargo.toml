[package]
name = "hayro-interpret"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "A crate for interpreting PDF files."
repository = "https://github.com/LaurenzV/hayro"

[dependencies]
hayro-cmap = { version = "0.1.1", default-features = false }
hayro-font = { version = "0.5.0", default-features = false }
hayro-postscript = { version = "0.2.0", default-features = false }
hayro-syntax = { version = "0.9.0", default-features = false, features = ["std", "images", "unsafe"] }
kurbo = "0.13.0"
smallvec = "1"
moxcms = { version = "0.8.1", features = ["in_place"] }
siphasher = "1"
bitflags = "2.10"
rustc-hash = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["embed-fonts", "embed-cmaps"]
embed-fonts = ["hayro-font/embed-fonts"]
embed-cmaps = ["hayro-cmap/embed-cmaps"]
