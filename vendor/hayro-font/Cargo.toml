[package]
name = "hayro-font"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "A crate for parsing the fonts of PDF files."
repository = "https://github.com/LaurenzV/hayro"

[features]
default = ["embed-fonts"]
embed-fonts = []

[dependencies]
bitflags = "2.10"
hayro-cmap = { version = "0.1.1", default-features = false }
hayro-syntax = { version = "0.9.0", default-features = false, features = ["std"] }
kurbo = "0.13.0"
phf = { version = "0.13.1", default-features = false, features = ["macros"] }
rustc-hash = "2"
siphasher = "1"
skrifa = "0.49.0"
