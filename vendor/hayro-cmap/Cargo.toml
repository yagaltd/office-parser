[package]
name = "hayro-cmap"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
description = "A parser for CMap files."
repository = "https://github.com/LaurenzV/hayro"

[features]
default = ["embed-cmaps"]
std = []
embed-cmaps = ["std", "dep:brotli"]

[dependencies]
hayro-postscript = { version = "0.2.0", default-features = false }
brotli = { version = "8", optional = true, default-features = false, features = ["std"] }
