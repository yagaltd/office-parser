[package]
name = "office-parser-cli"
version = "0.2.0"
edition = "2024"
description = "CLI for office-parser to export parsed content to Markdown or JSON."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/office-parser-cli"
keywords = ["cli", "parser", "office", "markdown", "json"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

office-parser = { version = "0.2.0", path = "..", features = ["ocr-indra"] }

[features]
# In-process Indra engine (Mode B); without it --ocr uses the subprocess engine.
ocr-indra-native = ["office-parser/ocr-indra-native"]
# pdfium rendering for the OCR path (preferred over pdftoppm when installed)
render-pdfium = ["office-parser/render-pdfium"]

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
